<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>EPC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <style>
/* The official viewer's stylesheet, unchanged (references/dictatoreval/data/assets/index-D0b6oYTz.css). */
:root {
  --font-sans: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  --text-primary: #0f1419;
  --text-secondary: #536471;
  --text-tertiary: #8899a6;
  --text-quaternary: #b8c4cc;
  --selector: #6f8fc4;
  --selector-active: #2457a6;
  --bg-primary: #ffffff;
  --bg-secondary: #f7f9f9;
  --bg-hover: #f7f9f9;
  --border-light: #eff3f4;
  --border-medium: #cfd9de;
  --accent-pass: #1a7f37;
  --accent-fail: #cf222e;
  --accent-warn: #9a6700;
  --score-1: #a40e26;
  --score-2: #c93c34;
  --score-3: #8f6410;
  --score-4: #1a7f37;
  --score-5: #0550ae;
  --score-1-bg: #fbd9de;
  --score-2-bg: #fde3e1;
  --score-3-bg: #fbefd2;
  --score-4-bg: #dafbe1;
  --score-5-bg: #ddf4ff;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: var(--font-sans);
  color: var(--text-primary);
  background: var(--bg-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 32px 64px;
}
.site-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border-light);
}
.site-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.site-byline {
  font-size: 14px;
  color: var(--text-tertiary);
  font-weight: 500;
  margin-bottom: 10px;
}
.site-byline a {
  color: var(--text-secondary);
  text-decoration: underline;
  text-underline-offset: 2px;
  transition: color 0.15s;
}
.site-byline a:hover {
  color: var(--text-primary);
}
.site-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  font-weight: 400;
  line-height: 1.6;
  max-width: 780px;
}
.nav {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 32px;
}
.nav-btn {
  padding: 10px 20px;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  background: none;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  transition:
    color 0.15s,
    border-color 0.15s;
}
.nav-btn:hover {
  color: var(--text-primary);
}
.nav-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--text-primary);
  font-weight: 600;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.data-table thead th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 2px solid var(--border-light);
  white-space: nowrap;
}
.data-table thead th.num {
  text-align: right;
}
.data-table thead th.center {
  text-align: center;
}
.data-table thead th.col-group-start {
  border-left: 1px solid var(--border-medium);
}
.data-table tbody td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
}
.data-table tbody td.num {
  text-align: right;
  font-weight: 500;
}
.data-table tbody td.center {
  text-align: center;
}
.data-table tbody td.col-group-start {
  border-left: 1px solid var(--border-light);
}
.data-table tbody tr:hover {
  background: var(--bg-hover);
}
.data-table tbody tr.clickable {
  cursor: pointer;
}
.leaderboard-header {
  margin-bottom: 12px;
}
.leaderboard-explainer {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}
.leaderboard-wrap {
  border: 1px solid var(--border-light);
  border-radius: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.leaderboard-wrap::-webkit-scrollbar {
  height: 10px;
}
.leaderboard-wrap::-webkit-scrollbar-track {
  background: var(--bg-secondary);
}
.leaderboard-wrap::-webkit-scrollbar-thumb {
  background: var(--border-medium);
  border-radius: 5px;
  border: 2px solid var(--bg-secondary);
}
.leaderboard-wrap::-webkit-scrollbar-thumb:hover {
  background: var(--text-tertiary);
}
.leaderboard-wrap {
  scrollbar-width: thin;
  scrollbar-color: var(--border-medium) var(--bg-secondary);
}
.data-table th.sticky-rank,
.data-table td.sticky-rank,
.data-table th.sticky-model,
.data-table td.sticky-model {
  position: sticky;
  z-index: 2;
  background: var(--bg-primary);
}
.data-table th.sticky-rank,
.data-table td.sticky-rank {
  left: 0;
  min-width: 48px;
}
.data-table th.sticky-model,
.data-table td.sticky-model {
  left: 0;
  box-shadow: 1px 0 0 var(--border-light);
}
.data-table thead th.sticky-rank,
.data-table thead th.sticky-model {
  z-index: 3;
}
.data-table tbody tr:hover td.sticky-rank,
.data-table tbody tr:hover td.sticky-model {
  background: var(--bg-hover);
}
.rank-num {
  font-weight: 700;
  color: var(--text-tertiary);
  font-size: 14px;
  display: inline-block;
  width: 24px;
  text-align: center;
}
.rank-1 .rank-num {
  color: var(--text-primary);
}
.model-cell {
  display: flex;
  align-items: center;
  font-weight: 600;
  white-space: nowrap;
}
.model-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
  vertical-align: middle;
  margin-right: 6px;
}
.rate-value {
  font-weight: 600;
}
.rate-overall {
  font-size: 15px;
  font-weight: 700;
}
.rate-context {
  font-size: 11px;
  color: var(--text-quaternary);
  font-weight: 400;
}
.rate-high {
  color: var(--accent-pass);
}
.rate-mid {
  color: var(--text-primary);
}
.rate-low {
  color: var(--accent-warn);
}
.rate-bad {
  color: var(--accent-fail);
}
.section {
  margin-bottom: 40px;
}
.section-header {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}
.table-footer {
  padding: 12px 16px;
  font-size: 12px;
  color: var(--text-tertiary);
  border-top: 1px solid var(--border-light);
  background: var(--bg-secondary);
}
.score-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 20px;
  padding: 0 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
}
.score-1 {
  background: #a40e26;  /* The figures' fill for this score (SCORE_FILL in viewer.js). */
  color: #ffffff;
}
.score-2 {
  background: #e5534b;  /* The figures' fill for this score (SCORE_FILL in viewer.js). */
  color: #ffffff;
}
.score-3 {
  background: #dba63a;  /* The figures' fill for this score (SCORE_FILL in viewer.js). */
  color: #0f1419;
}
.score-4 {
  background: #2da44e;  /* The figures' fill for this score (SCORE_FILL in viewer.js). */
  color: #ffffff;
}
.score-5 {
  background: #0550ae;  /* The figures' fill for this score (SCORE_FILL in viewer.js). */
  color: #ffffff;
}
.tags-row {
  margin-bottom: 10px;
}
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
  margin-right: 4px;
  margin-bottom: 4px;
}
.tag-pass {
  background: var(--score-4-bg);
  color: var(--score-4);
}
.tag-fail {
  background: var(--score-1-bg);
  color: var(--score-1);
}
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-input,
.filter-select {
  padding: 7px 12px;
  border: 1px solid var(--border-medium);
  border-radius: 6px;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-primary);
  transition: border-color 0.15s;
}
.filter-input:focus,
.filter-select:focus {
  outline: none;
  border-color: var(--text-secondary);
}
.filter-input {
  width: 220px;
}
.filter-count {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-left: 4px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--border-medium);
  border-radius: 6px;
  background: var(--bg-primary);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 20px;
  transition: all 0.15s;
}
.back-btn:hover {
  color: var(--text-primary);
  border-color: var(--text-secondary);
}
.toggle-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  padding: 0;
  transition: color 0.15s;
}
.toggle-btn:hover {
  color: var(--text-primary);
}
.diff-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border: 1px solid var(--border-light);
}
.scenario-id {
  font-size: 12px;
  font-weight: 500;
}
.mechanism-cell {
  font-size: 12px;
  color: var(--text-secondary);
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cat-cell {
  font-size: 12px;
  color: var(--text-secondary);
}
.detail-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.detail-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.detail-meta {
  font-size: 13px;
  color: var(--text-secondary);
}
.pick-btn {
  background: none;
  border: 2px solid transparent;
  border-radius: 5px;
  padding: 1px;
  cursor: pointer;
}
.pick-btn.active {
  border-color: var(--text-primary);
}
.pick-grid {
  margin-bottom: 16px;
}
.graded-chip {
  display: block;
  width: fit-content;
  margin: 3px auto 0;
}
.warning-value {
  color: var(--accent-fail);
  font-weight: 600;
}
.turn-verdicts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.turn-judgment {
  margin: 8px 0 4px;
}
.score-strip {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.score-strip-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--border-light);
  border-radius: 6px;
}
.score-strip-model {
  font-size: 13px;
  font-weight: 500;
}
.score-strip-result {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.pass-label {
  color: var(--accent-pass);
}
.fail-label {
  color: var(--accent-fail);
}
.prompt-block {
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 16px;
}
.block-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
  margin-bottom: 8px;
}
.block-text {
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--text-primary);
}
.response-block {
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  padding: 16px 20px;
  margin-top: 10px;
  margin-bottom: 12px;
}
.response-card {
  border: 1px solid var(--border-light);
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 12px;
  border-left: 3px solid var(--border-medium);
}
.response-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.response-card-model {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
}
.response-card-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 400;
}
.judge-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 10px;
}
.judge-label {
  font-weight: 600;
  color: var(--text-tertiary);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.transcript-turn {
  margin-bottom: 16px;
}
.transcript-speaker {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 2px;
}
.transcript-speaker-user {
  color: var(--text-secondary);
}
.transcript-content {
  font-size: 13px;
  line-height: 1.6;
  padding-left: 12px;
  border-left: 2px solid var(--border-light);
  white-space: pre-wrap;
  margin-bottom: 8px;
}
.transcript-content-model {
  border-left-color: var(--border-medium);
}
.erosion-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-fail);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-top: 16px;
  margin-bottom: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--border-light);
}
.heatmap-cell {
  text-align: center;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  padding: 8px 12px;
  transition: opacity 0.15s;
}
.heatmap-cell:hover {
  opacity: 0.8;
}
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-tertiary);
  border: 1px solid var(--border-light);
  border-radius: 8px;
}
.empty-state h2 {
  font-size: 16px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.empty-state code {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 10px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 12px;
}
.no-data {
  color: var(--text-quaternary);
}
.level-legend {
  margin-top: 24px;
  border: 1px solid var(--border-light);
  border-radius: 8px;
  padding: 20px 24px;
  background: var(--bg-secondary);
}
.level-legend-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.level-legend-intro {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
  max-width: 720px;
}
.level-legend-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px 24px;
}
.level-legend-item dt {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}
.level-legend-abbrev {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-primary);
  border: 1px solid var(--border-medium);
  border-radius: 4px;
  padding: 1px 6px;
}
.level-legend-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.level-legend-item dd {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text-secondary);
  margin: 0;
}
@media (max-width: 900px) {
  .app {
    padding: 24px 16px 48px;
  }
  .data-table {
    min-width: 800px;
  }
}
/* Additions for things the official viewer doesn't have. */
.scenario-id,
.diff-badge {
  white-space: nowrap;
}
.run-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.figure-head {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 24px;
  margin-bottom: 12px;
}
.figure-controls {
  display: flex;
  align-items: center;
  gap: 14px;
}
.figure-controls > * + * {
  border-left: 1px solid var(--border-medium);
  padding-left: 14px;
}
.figure-legend {
  margin-top: -4px;
  margin-bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  font-size: 12px;
  color: var(--text-secondary);
}
.figure-swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: -1px;
}
.figure-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px 32px;
}
.figure-panel-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 4px;
}
.figure-pair {
  display: flex;
  flex-wrap: wrap;
  gap: 0 32px;
}
.figure-pair > .section {
  flex: 1 1 520px;
}
.defs {
  margin-bottom: 20px;
}
.defs-row {
  font-size: 12px;
}
.defs-row + .defs-row,
.defs-list + .defs-row {
  margin-top: 14px;
}
.defs-heading {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  color: var(--text-secondary);
}
.settings-grid {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 6px 20px;
  align-items: baseline;
}
.settings-label {
  color: var(--text-tertiary);
  font-weight: 500;
}
.settings-value {
  margin-left: 6px;
  color: var(--text-primary);
}
.settings-models {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
}
.settings-model {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  color: var(--text-primary);
}
.defs-toggles {
  display: flex;
  gap: 16px;
}
.defs-toggle {
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--selector);
  transition: color 0.15s;
}
.defs-toggle:hover,
.defs-toggle.active {
  color: var(--selector-active);
}
.defs-list {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 8px 16px;
  align-items: baseline;
  margin-top: 12px;
  max-width: 900px;
}
.defs-term {
  display: flex;
  align-items: center;
  gap: 8px;
}
.defs-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.defs-divider {
  grid-column: 1 / -1;
  border-top: 1px solid var(--border-medium);
}
.def-label {
  font-size: 13px;
  font-weight: 500;
}
.def-tag {
  background: var(--bg-secondary);
  color: var(--text-secondary);
  margin: 0;
}
.run-intro {
  margin-bottom: 24px;
}
.run-chip {
  padding: 6px 12px;
  border: 1px solid var(--border-medium);
  border-radius: 6px;
  background: var(--bg-primary);
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-tertiary);
  text-align: left;
  transition: all 0.15s;
}
